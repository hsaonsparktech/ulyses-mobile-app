<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
<title id="title">Open book app icon</title>
<desc id="desc">Teal and navy open book on a rounded white tile with layered pale gray shading and soft glossy texture.</desc>
<defs>
  <path id="tile" d="M310 69H938C1076 69 1187 181 1187 317V941C1187 1078 1079 1188 941 1188H310C172 1188 59 1078 59 941V317C59 178 171 69 310 69Z" />
  <clipPath id="tile-clip"><use href="#tile" /></clipPath>
  <radialGradient id="tile-base" cx="54%" cy="43%" r="76%">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.62" stop-color="#fbfbfc"/>
    <stop offset="0.87" stop-color="#f5f5f7"/>
    <stop offset="1" stop-color="#e5e6e9"/>
  </radialGradient>
  <linearGradient id="glass-upper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".96"/><stop offset=".54" stop-color="#f0f0f3" stop-opacity=".60"/><stop offset="1" stop-color="#e0e0e5" stop-opacity=".37"/></linearGradient>
  <linearGradient id="glass-lower" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f2f6" stop-opacity=".08"/><stop offset="1" stop-color="#e1e1e6" stop-opacity=".78"/></linearGradient>
  <linearGradient id="rear-l" x1="8%" y1="65%" x2="94%" y2="52%">
    <stop offset="0" stop-color="#07a57c"/><stop offset=".31" stop-color="#067e76"/><stop offset=".64" stop-color="#07556a"/><stop offset="1" stop-color="#072d51"/>
  </linearGradient>
  <linearGradient id="rear-r" x1="95%" y1="65%" x2="5%" y2="49%">
    <stop offset="0" stop-color="#079f79"/><stop offset=".33" stop-color="#078476"/><stop offset=".65" stop-color="#065268"/><stop offset="1" stop-color="#062b4f"/>
  </linearGradient>
  <linearGradient id="front-l" x1="8%" y1="17%" x2="98%" y2="78%">
    <stop offset="0" stop-color="#0ca580"/><stop offset=".21" stop-color="#058f79"/><stop offset=".52" stop-color="#076479"/><stop offset=".79" stop-color="#073e66"/><stop offset="1" stop-color="#07264e"/>
  </linearGradient>
  <linearGradient id="front-r" x1="95%" y1="15%" x2="8%" y2="78%">
    <stop offset="0" stop-color="#08a57e"/><stop offset=".30" stop-color="#078679"/><stop offset=".59" stop-color="#075a73"/><stop offset=".82" stop-color="#073c63"/><stop offset="1" stop-color="#07274f"/>
  </linearGradient>
  <radialGradient id="shadow-center" cx="51%" cy="91%" r="62%"><stop offset="0" stop-color="#020b31" stop-opacity=".50"/><stop offset="1" stop-color="#031e3d" stop-opacity="0"/></radialGradient>
  <filter id="tile-drop" x="-15%" y="-15%" width="130%" height="135%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="edge-shade" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="fold-shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<!-- Solid canvas: intentionally not transparent -->
<rect width="1254" height="1254" fill="#ffffff"/>
<!-- Soft tile body and perimeter shadow -->
<use href="#tile" transform="translate(0 4)" fill="#a4a6ad" opacity=".36" filter="url(#tile-drop)"/>
<use href="#tile" fill="url(#tile-base)"/>
<g clip-path="url(#tile-clip)">
  <!-- Pale gray pearlescent swooshes that are part of the original icon treatment -->
  <path d="M59 317C59 179 171 69 310 69H824C791 217 743 358 665 475C556 639 363 727 59 823Z" fill="url(#glass-upper)" opacity=".78"/>
  <path d="M823 69H939C1079 69 1187 178 1187 317V768C1109 892 908 1004 823 1188H625C678 1011 743 827 909 678C975 605 1114 542 1187 503V317C1187 181 1078 69 939 69Z" fill="#ffffff" opacity=".16"/>
  <path d="M59 826C287 794 484 708 620 524C721 385 776 226 822 69H938C1083 69 1187 181 1187 317V712C1018 864 900 1013 826 1188H308C168 1188 59 1078 59 941Z" fill="url(#glass-lower)" opacity=".36"/>
  <path d="M59 829C303 792 520 709 676 466C744 360 788 212 822 69" fill="none" stroke="#f4f4f8" stroke-opacity=".33" stroke-width="1"/>
  <path d="M823 1188C850 1033 1005 828 1187 741" fill="none" stroke="#ffffff" stroke-opacity=".36" stroke-width="1"/>
  <!-- Slight inner bevel visible at the tile edge -->
  <use href="#tile" fill="none" stroke="#b9bcc3" stroke-opacity=".23" stroke-width="13" filter="url(#edge-shade)"/>
</g>

<!-- Four independently editable book leaves, rear leaves first -->
<g id="book-symbol">
  <path id="back-left-page" d="M294 464H259C225 464 203 488 203 526V786C203 822 228 840 265 840C283 840 302 827 350 823C461 810 546 848 600 917C607 928 614 926 614 915V531C614 493 584 464 548 464Z" fill="url(#rear-l)"/>
  <path id="back-right-page" d="M953 464H987C1020 464 1043 488 1043 526V788C1043 822 1018 840 982 840C961 840 944 827 896 823C783 809 705 852 649 918C640 931 636 928 636 915V531C636 493 665 464 702 464Z" fill="url(#rear-r)"/>
  <path d="M299 640C300 693 319 712 360 723C482 741 566 806 610 912L610 932C562 850 481 814 363 819C304 819 271 841 247 836C286 825 289 716 299 640Z" fill="#001d3e" opacity=".27" filter="url(#fold-shadow)"/>
  <path d="M949 640C947 694 927 713 888 724C763 738 681 810 639 915V931C692 849 769 811 887 822C951 824 976 840 1002 834C964 817 958 713 949 640Z" fill="#001d3e" opacity=".28" filter="url(#fold-shadow)"/>
  <path id="front-left-page" d="M353 334C421 334 524 374 566 418C597 450 613 490 613 532V919C613 925 607 930 601 922C537 830 460 745 354 722C314 714 292 687 292 640V396C292 354 315 332 353 334Z" fill="url(#front-l)"/>
  <path id="front-right-page" d="M889 334C821 334 719 374 677 418C650 450 636 490 636 532V920C636 926 643 929 648 922C711 830 787 747 892 722C931 714 954 687 954 640V396C954 355 929 332 889 334Z" fill="url(#front-r)"/>
  <!-- Local, soft shade inside the book's center fold -->
  <path d="M471 369C575 407 611 466 613 533V924C603 868 577 799 519 754C564 778 597 818 613 856V531C612 453 575 413 471 369Z" fill="url(#shadow-center)" opacity=".38"/>
  <path d="M776 372C671 406 636 466 636 534V924C646 867 672 798 730 753C685 778 650 819 636 856V531C637 454 675 413 776 372Z" fill="url(#shadow-center)" opacity=".30"/>
</g>
</svg>